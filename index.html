<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Haidian Hidden Library</title>
  <!--
    2026-11-03 LG UH5F 老電視效能版（版面與功能和原本相同）
    1) 修正「每 30 秒整頁重畫」：後端每次都回傳新的 serverTime / updatedAt，
       原本的比對永遠不同，所以每 30 秒把所有投影片、圖片全部重建一次。現在只在內容真的變了才更新，也不會打斷正在播的那張。
    2) 畫面上同時只放 2 張投影片（目前這張 + 淡出中的上一張），不再把所有大圖一次塞進記憶體；下一張圖先預載。
    3) 舊瀏覽器相容：video.play() 在舊版不會回傳 Promise，原本的 .catch() 會讓輪播卡死在影片那張；filter / transform 補上 -webkit- 前綴。
    4) 拿掉 Noto Sans TC 網路字型（中文字型檔很大，老電視下載和繪製都很慢），改用電視內建中文字型。
    5) 拿掉大面積 drop-shadow 濾鏡、transition: all 改成只做透明度與位移，跑馬燈改用 GPU 位移。
    6) 每 60 秒抓一次資料（原本 30 秒），後端溫度本來就是 5 分鐘更新一次。
    8) 影片改用全頁共用的單一播放器：老 LG 每建一個新的 <video> 就佔用一個硬體解碼器且不會釋放，
       第二次播放就黑屏、要重開機。現在整頁只有一個 <video>，重複使用。
    7) 影片：在試算表「圖片網址」欄填影片網址即可，支援
       - 直接的 .mp4 / .webm / .m4v 網址（最穩，建議把影片放在 tv.twranger.com/videos/ 底下）
       - Google 雲端硬碟分享連結（需設為「知道連結的任何人」，檔案建議 100MB 以下）
       - YouTube 連結（Chromium 80 以下的老電視會自動略過，避免黑畫面；播放秒數照試算表「秒數」欄）
       mp4 / 雲端硬碟影片會播完整支才換下一張；YouTube 則依「秒數」欄。
       聲音：試算表「影片聲音」欄打勾才出聲，預設靜音。
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap');

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000;
      font-family: "Noto Sans TC", "Noto Sans CJK TC", "LG Smart UI", "Microsoft JhengHei", Arial, sans-serif;
    }

    #screen {
      width: 100%; height: 100%; position: relative;
      overflow: hidden; color: white; background: #000;
    }

    .topbar {
      position: absolute; top: 28px; left: 40px; right: 40px;
      z-index: 40; display: -webkit-flex; display: flex;
      -webkit-justify-content: space-between; justify-content: space-between;
      font-size: 28px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.8);
    }

    #slides { width: 100%; height: 100%; position: relative; }

    .slide {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; -webkit-transition: opacity 1s ease; transition: opacity 1s ease;
      -webkit-background-size: contain; background-size: contain; background-position: center;
      background-repeat: no-repeat; background-color: #000;
    }
    .slide.active { opacity: 1; z-index: 2; }
    .slide.no-image { background: linear-gradient(135deg, #263238, #1565c0); }
    /* 影片投影片本身透明，底下是全頁共用的播放器 */
    .slide.video-slide { background: transparent; }
    #player {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; background: #000; object-fit: contain; display: none;
    }

    .empty {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      box-sizing: border-box; padding-top: 40vh; text-align: center;
      font-size: 44px; background: linear-gradient(135deg, #263238, #1565c0);
    }

    /* ❄️ 冷氣通知 */
    .slide-ac {
      background: linear-gradient(135deg, #002b5e 0%, #000212 100%);
      display: -webkit-flex; display: flex;
      -webkit-align-items: center; align-items: center;
      -webkit-justify-content: center; justify-content: center; z-index: 10;
    }
    .slide-ac.active { z-index: 10; }
    .ac-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.25) 0%, transparent 50%),
                  radial-gradient(circle at bottom left, rgba(58, 123, 213, 0.25) 0%, transparent 50%);
      z-index: 1;
    }
    .ac-content { position: relative; z-index: 20; text-align: center; }
    .ac-badge {
      display: inline-block; background: #00d2ff; color: #00132b;
      padding: 10px 35px; border-radius: 50px; font-size: 34px;
      font-weight: 900; margin-bottom: 30px; letter-spacing: 4px;
    }
    .ac-temp {
      font-size: 150px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
      line-height: 1; margin-bottom: 25px;
    }
    .ac-unit { font-size: 70px; vertical-align: super; }
    .ac-text { font-size: 36px; line-height: 1.5; color: #b2ebf2; font-weight: 700; margin-bottom: 16px; }
    .ac-subtext { font-size: 22px; color: rgba(178, 235, 242, 0.6); font-weight: 500; letter-spacing: 1px; }

    /* 🌟 錢天堂幸運客 */
    .slide-lucky {
      background: #150a21; display: -webkit-flex; display: flex;
      -webkit-align-items: center; align-items: center;
      -webkit-justify-content: center; justify-content: center; z-index: 10;
    }
    .slide-lucky.active { z-index: 10; }
    .lucky-bg-full { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('images/grocery.png'); -webkit-background-size: cover; background-size: cover; background-position: center; opacity: 0.45; z-index: 1; }
    .lucky-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(15,8,30,0.1) 0%, rgba(10,4,20,0.85) 100%); z-index: 2; }
    .lucky-content { position: relative; z-index: 20; width: 90%; max-width: 1400px; text-align: center; }
    .lucky-badge { display: inline-block; background: linear-gradient(to bottom, #ffd700, #b8860b); color: #1a0b2e; padding: 10px 35px; border-radius: 50px; font-size: 34px; font-weight: 900; margin-bottom: 25px; letter-spacing: 4px; line-height: 40px; }
    .premium-coin { display: inline-block; vertical-align: middle; width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(ellipse at 30% 30%, #fff1b8 0%, #fadb14 30%, #d48806 80%, #874d00 100%); border: 2px solid #fffbe6; margin: 0 15px; position: relative; }
    .premium-coin:after { content: '錢'; position: absolute; top: 50%; left: 50%; -webkit-transform: translate(-50%, -48%); transform: translate(-50%, -48%); font-size: 22px; line-height: 1; font-weight: 900; color: #fffbe6; text-shadow: 1px 1px 2px rgba(135, 77, 0, 0.8); }
    .lucky-text { font-size: 30px; line-height: 1.5; color: #e0d8cc; white-space: pre-wrap; font-weight: 500; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
    .highlight-stamp { display: inline-block; color: #d32f2f; background: #fdfaf3; border: 4px solid #d32f2f; padding: 8px 30px; border-radius: 6px; font-family: 'Courier Prime', 'Courier New', monospace; font-size: 65px; font-weight: 900; letter-spacing: 8px; -webkit-transform: rotate(-3deg); transform: rotate(-3deg); box-shadow: 3px 3px 0px rgba(211, 47, 47, 0.2); margin: 10px 0 25px 0; text-shadow: none; }
    .highlight-book { display: inline-block; font-size: 58px; color: #fffde7; font-weight: 900; text-shadow: 0 0 15px rgba(255, 249, 196, 0.6); margin: 10px 0 20px 0; padding: 0 10px; letter-spacing: 2px; }

    /* 一般投影片文字框 */
    .content {
      position: absolute; left: 6vw; bottom: 11vh; z-index: 25;
      background: rgba(0,0,0,.68); padding: 14px 18px 16px; border-radius: 12px;
      box-sizing: border-box; max-width: 46vw;
      opacity: 0; -webkit-transform: translateY(20px); transform: translateY(20px);
      -webkit-transition: opacity .8s ease, -webkit-transform .8s ease;
      transition: opacity .8s ease, transform .8s ease;
    }
    .slide.active .content { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 18px; font-weight: 900; margin-bottom: 8px; letter-spacing: 1px; background: #00bcd4; color: #fff; }
    .badge-breaking { background: #d32f2f; }
    .badge-volunteer { background: #f57c00; }
    .badge-student { background: #388e3c; }
    h1 { font-size: 30px; line-height: 1.25; margin: 0 0 6px; font-weight: 900; }
    .subtitle { font-size: 20px; line-height: 1.45; font-weight: 500; opacity: .92; white-space: pre-wrap; }
    .name-grid { margin-top: 12px; margin-bottom: 6px; }
    .name-chip { display: table; margin-bottom: 14px; padding: 8px 20px 8px 16px; border-radius: 50px; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.28); font-size: 25px; font-weight: 800; line-height: 1.2; white-space: nowrap; }
    .name-icon { display: inline-block; margin-right: 12px; text-align: center; font-size: 26px; line-height: 1; }
    .class-prefix { display: inline-block; margin-right: 14px; font-size: 22px; opacity: .8; font-weight: 700; line-height: 1; }
    .quote { font-size: 21px; line-height: 1.5; font-weight: 500; color: #f5f5f5; border-left: 4px solid #ff9800; padding-left: 16px; margin-top: 14px; letter-spacing: 1px; opacity: 0.95; white-space: pre-wrap; }
    .quote-student { border-left-color: #4caf50; }

    #marqueeWrap { position: absolute; left: 0; right: 0; bottom: 12px; height: 60px; z-index: 30; background: rgba(0,0,0,.86); overflow: hidden; border-top: 2px solid rgba(255,255,255,.25); }
    #marquee {
      position: absolute; top: 0; left: 0; height: 60px; line-height: 60px;
      white-space: nowrap; font-size: 30px; font-weight: 800; padding-left: 100%;
      will-change: transform;
      -webkit-animation: marquee 30s linear infinite; animation: marquee 30s linear infinite;
    }
    @-webkit-keyframes marquee { from { -webkit-transform: translate3d(0,0,0); } to { -webkit-transform: translate3d(-100%,0,0); } }
    @keyframes marquee { from { transform: translate3d(0,0,0); } to { transform: translate3d(-100%,0,0); } }
  </style>
</head>

<body>
  <div id="screen">
    <div class="topbar">
      <div>海佃地下圖書室</div>
      <div id="clock"></div>
    </div>
    <div id="slides"><video id="player" playsinline preload="none"></video></div>
    <div id="marqueeWrap"><div id="marquee">Hidden below, growing beyond.</div></div>
  </div>

  <script>
    var GAS_API_URL = 'https://script.google.com/a/macros/go.edu.tw/s/AKfycbwSAYrzs4Mc9oEGnJYFqd-bOZ8PJ3dYrXdutp5b3TniGzWt56uYXLiRDRFPGe-7n_lN/exec';

    var rawData = { slides: [], volunteers: [], studentVols: [], marquee: '', acAlert: null };
    var slides = [];          // 目前要輪播的投影片資料
    var slideHtml = [];       // 每張投影片的 HTML（需要時才放進畫面）
    var current = 0;
    var timer = null;
    var playToken = 0;
    var activeEl = null;
    var lastRawSig = '';
    var lastSlidesSig = '';
    var preloadImg = new Image();
    var AC_BEEP_LUNCH_START = 12 * 60;           // 12:00 起進入午休靜音
    var AC_BEEP_AFTERNOON_START = 13 * 60 + 35;  // 13:35 起算下午
    var acBeepFallback = {};

    function $(id) { return document.getElementById(id); }

    // 老電視瀏覽器（Chromium 80 以下）YouTube 播放器只會黑畫面，直接略過 YouTube 投影片
    var CHROME_VER = (function () { var m = navigator.userAgent.match(/Chrome\/(\d+)/); return m ? Number(m[1]) : 0; })();
    var CAN_PLAY_YOUTUBE = CHROME_VER >= 80 || (!CHROME_VER && /Firefox|Safari/.test(navigator.userAgent));


    function loadData() {
      var oldScript = $('jsonpScript');
      if (oldScript) { oldScript.parentNode.removeChild(oldScript); }
      var script = document.createElement('script');
      script.id = 'jsonpScript';
      script.onerror = function () {};   // 抓不到就繼續播舊資料
      script.src = GAS_API_URL + '?callback=handleData&t=' + new Date().getTime();
      document.body.appendChild(script);
    }

    function handleData(data) {
      if (!data) return;
      try { localStorage.setItem('hhl_cache', JSON.stringify(data)); } catch (e) {}
      // serverTime / updatedAt 每次都不同，比對時排除，避免每次都整頁重畫
      var sig = JSON.stringify([data.slides, data.volunteers, data.studentVols, data.marquee, data.acAlert]);
      if (sig !== lastRawSig) {
        lastRawSig = sig;
        rawData.slides = data.slides || [];
        rawData.volunteers = data.volunteers || [];
        rawData.studentVols = data.studentVols || [];
        rawData.marquee = data.marquee || 'Hidden below, growing beyond.';
        rawData.acAlert = data.acAlert || null;
        var m = $('marquee');
        if (m.textContent !== rawData.marquee) m.textContent = rawData.marquee;
      }
      // 志工依時段出現，所以每次都重新計算；結果沒變就什麼都不做
      refreshSlides();
    }

    // 清空投影片，但保留共用播放器 #player
    function clearSlidesBox() {
      var box = $('slides');
      for (var i = box.childNodes.length - 1; i >= 0; i--) {
        var n = box.childNodes[i];
        if (n.id !== 'player') box.removeChild(n);
      }
    }

    function refreshSlides() {
      buildSlides();
      var sig = JSON.stringify(slides);
      if (sig === lastSlidesSig) return;
      lastSlidesSig = sig;

      slideHtml = [];
      for (var i = 0; i < slides.length; i++) slideHtml.push(renderOne(slides[i]));

      var box = $('slides');
      if (!slides.length) {
        clearTimeout(timer); timer = null; playToken++;
        activeEl = null;
        stopPlayer();
        clearSlidesBox();
        var em = document.createElement('div');
        em.className = 'empty';
        em.innerHTML = '目前沒有可播放的消息';
        box.appendChild(em);
        return;
      }
      if (current >= slides.length) current = 0;
      if (!activeEl) {           // 第一次（或從空白恢復）才立刻播放；其餘照原本節奏換到新內容
        clearSlidesBox();
        play();
      }
    }

    function buildSlides() {
      var now = new Date();
      var day = now.getDay();
      var mins = now.getHours() * 60 + now.getMinutes();

      var rawSlides = rawData.slides || [];
      var luckySlide = null;
      var breakingNews = [];
      var posts = [];

      for (var i = 0; i < rawSlides.length; i++) {
        if (rawSlides[i].title && rawSlides[i].title.indexOf('錢天堂') > -1) {
          luckySlide = rawSlides[i];
        } else if (rawSlides[i].type === 'breaking') {
          breakingNews.push(rawSlides[i]);
        } else {
          posts.push(rawSlides[i]);
        }
      }

      var mixedSlides = [];
      if (breakingNews.length > 0 && posts.length > 0) {
        for (var p = 0; p < posts.length; p++) {
          mixedSlides.push(posts[p]);
          mixedSlides.push(breakingNews[p % breakingNews.length]);
        }
      } else { mixedSlides = posts.concat(breakingNews); }

      var activeVols = [];
      for (var v = 0; v < rawData.volunteers.length; v++) {
        var item = rawData.volunteers[v];
        if (item.dayOfWeek === day && mins >= item.startMins && mins <= item.endMins) {
          activeVols.push({ type: 'volunteer', title: item.name, subtitle: item.phrase, image: item.image, duration: item.duration });
        }
      }

      var activeStudents = [];
      for (var s = 0; s < rawData.studentVols.length; s++) {
        var stu = rawData.studentVols[s];
        if (stu.dayOfWeek === day) {
          activeStudents.push({ type: 'studentVol', title: stu.name, classStr: stu.classStr, subtitle: stu.phrase || '圖書室小志工，為您服務！', image: stu.image, duration: stu.duration });
        }
      }

      slides = mixedSlides.concat(activeVols).concat(activeStudents);
      if (!CAN_PLAY_YOUTUBE) {
        var playable = [];
        for (var k = 0; k < slides.length; k++) {
          if (mediaInfo(slides[k].image).kind !== 'youtube') playable.push(slides[k]);
        }
        slides = playable;
      }
      if (luckySlide) { slides.unshift(luckySlide); }

      var ac = rawData.acAlert;
      if (ac && ac.enabled && ac.temp !== null && ac.temp >= ac.threshold) {
        var acSlide = { type: 'ac-alert', temp: ac.temp, duration: 10 };
        if (luckySlide) { slides.splice(1, 0, acSlide); } else { slides.unshift(acSlide); }
      }
    }

    function renderOne(item) {
      if (item.type === 'ac-alert') {
        return '<div class="slide slide-ac">' +
            '<div class="ac-bg"></div>' +
            '<div class="ac-content">' +
              '<div class="ac-badge">❄️ 氣溫達標，冷氣使用提醒 ❄️</div>' +
              '<div class="ac-temp">' + escapeHtml(item.temp) + '<span class="ac-unit">°C</span></div>' +
              '<div class="ac-text">依市府氣象推估，目前戶外氣溫約 ' + escapeHtml(item.temp) + '°C</div>' +
              '<div class="ac-subtext">( 如遇冷氣尚未供電，煩請聯繫總務處協助開啟 )</div>' +
            '</div>' +
          '</div>';
      }

      if (item.title && item.title.indexOf('錢天堂') > -1) {
        var styledText = escapeHtml(item.subtitle)
          .replace(/《(.*?)》/g, '<span class="highlight-book">《$1》</span>')
          .replace(/【(.*?)】/g, '<span class="highlight-stamp">$1</span>');
        return '<div class="slide slide-lucky">' +
            '<div class="lucky-bg-full"></div>' +
            '<div class="lucky-overlay"></div>' +
            '<div class="lucky-content">' +
              '<div class="lucky-badge"><span class="premium-coin"></span>今日專屬幸運客<span class="premium-coin"></span></div>' +
              '<div class="lucky-text">' + styledText + '</div>' +
            '</div>' +
          '</div>';
      }

      var media = mediaInfo(item.image);
      var hasImage = media.kind === 'image';
      var isVideo = media.kind === 'video' || media.kind === 'youtube';
      var bg = '';
      var mediaHtml = '';

      if (media.kind === 'video') {
        // 不在每張投影片各建一個 <video>：老 LG 的硬體解碼器不會釋放，第二次就黑屏
        // 改用全頁共用的 #player，這裡只記下要播的網址
        var videoAttrs = ' data-video="' + escapeAttr(media.src) + '"' + (item.sound ? ' data-sound="1"' : '');
      } else if (media.kind === 'youtube') {
        mediaHtml = '<iframe data-yt="1" src="' + escapeAttr(media.src) + '" frameborder="0" allow="autoplay; encrypted-media" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0; z-index:1; background:#000;"></iframe>';
      } else if (hasImage) {
        bg = "background-image:url('" + escapeAttr(media.src) + "')";
      }

      var badgeText = '圖書室消息';
      var badgeClass = '';
      if (item.type === 'breaking') { badgeText = '號外插播'; badgeClass = 'badge-breaking'; }
      else if (item.type === 'volunteer') { badgeText = '今日值班志工'; badgeClass = 'badge-volunteer'; }
      else if (item.type === 'studentVol') { badgeText = '今日小志工'; badgeClass = 'badge-student'; }

      var bodyHtml = '';
      if (item.type === 'volunteer' || item.type === 'studentVol') {
        var names = String(item.title || '').split(/[\n、,，]+/);
        var chips = '';
        for (var n = 0; n < names.length; n++) {
          var name = trimText(names[n]);
          if (!name) continue;
          var icon = item.type === 'volunteer' ? '❤' : '📖';
          var iconColor = item.type === 'volunteer' ? '#ffb74d' : '#81c784';
          var classText = (item.type === 'studentVol' && item.classStr) ? '<span class="class-prefix">' + escapeHtml(item.classStr) + '</span>' : '';
          chips += '<div class="name-chip"><span class="name-icon" style="color:' + iconColor + ';">' + icon + '</span>' + classText + '<span>' + escapeHtml(name) + '</span></div>';
        }
        var quoteClass = item.type === 'studentVol' ? ' quote-student' : '';
        bodyHtml = '<div class="name-grid">' + chips + '</div>' + (item.subtitle ? '<div class="quote' + quoteClass + '">' + escapeHtml(item.subtitle) + '</div>' : '');
      } else if (trimText(item.title) !== '') {
        bodyHtml = '<h1>' + escapeHtml(item.title) + '</h1><div class="subtitle">' + escapeHtml(item.subtitle || '') + '</div>';
      }

      if (videoAttrs) {
        var c = bodyHtml !== '' ? '<div class="content"><div class="badge ' + badgeClass + '">' + badgeText + '</div>' + bodyHtml + '</div>' : '';
        return '<div class="slide video-slide"' + videoAttrs + '>' + c + '</div>';
      }
      var contentHtml = bodyHtml !== '' ? '<div class="content"><div class="badge ' + badgeClass + '">' + badgeText + '</div>' + bodyHtml + '</div>' : '';
      return '<div class="slide ' + (hasImage && !isVideo ? '' : 'no-image') + '" style="' + bg + '">' + mediaHtml + contentHtml + '</div>';
    }

    // 判斷網址是圖片、影片檔還是 YouTube
    function mediaInfo(url) {
      var u = trimText(url);
      if (!u) return { kind: 'none', src: '' };
      var m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i);
      if (m) {
        return { kind: 'youtube', src: 'https://www.youtube.com/embed/' + m[1] +
          '?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1&playsinline=1&loop=1&playlist=' + m[1] };
      }
      var d = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/i);
      if (d) {
        // 雲端硬碟：只有標成影片（網址含 #video 或檔名是影片）才當影片，其餘當圖片
        var driveVideo = /#video|\.(mp4|webm|m4v)/i.test(u);
        return driveVideo
          ? { kind: 'video', src: 'https://drive.google.com/uc?export=download&id=' + d[1] }
          : { kind: 'image', src: 'https://drive.google.com/thumbnail?id=' + d[1] + '&sz=w1920' };
      }
      // 一般網址：副檔名是影片，或網址最後加了 #video，就當影片播放
      if (/\.(mp4|webm|m4v|mov)(\?|#|$)/i.test(u) || /#video$/i.test(u)) return { kind: 'video', src: u.replace(/#video$/i, '') };
      return { kind: 'image', src: u };
    }

    function stopVideo(el) {
      if (!el || !el.querySelector) return;
      var f = el.querySelector('iframe');
      if (f) { try { f.src = 'about:blank'; } catch (e) {} }
    }

    // ===== 全頁共用的影片播放器（整個網頁只會有這一個 <video>）=====
    var playerHideTimer = null;
    function clearPlayerEvents(p) { p.onended = null; p.onerror = null; p.onloadedmetadata = null; }

    function stopPlayer() {
      var p = $('player');
      clearInterval(videoWatch);
      clearPlayerEvents(p);
      try { p.pause(); } catch (e) {}
      clearTimeout(playerHideTimer);
      // 等下一張淡入蓋住之後再藏起來；網址保留，下次同一支影片直接從頭播，不重新要解碼器
      playerHideTimer = setTimeout(function () { p.style.display = 'none'; }, 1100);
    }

    function releasePlayer() {   // 只在整頁重新整理前呼叫，把解碼器還給電視
      var p = $('player');
      clearPlayerEvents(p);
      try { p.pause(); p.removeAttribute('src'); p.load(); } catch (e) {}
    }

    // 老 LG 實測（偵錯畫面）：影片播完（ended）後，用「跳回 0 秒」重播，電視要卡 2～3 分鐘才會動，
    // 期間畫面停在最後一格、沒有聲音。但「重新載入影片」的第一次播放永遠正常。
    // 所以：每次輪到影片都重新載入，不再跳回 0 秒；並且改成看「影片有沒有在走」來決定何時換下一張。
    var videoWatch = null;
    // 老 LG 第二次要同一個網址時，連線會卡住不給資料（ready=0、已下載 0-0）。
    // 每次在網址後面加一個不同的 ?v=時間，讓電視當成新檔案重新下載。
    function freshUrl(src) {
      var hash = '', i = src.indexOf('#');
      if (i >= 0) { hash = src.slice(i); src = src.slice(0, i); }
      return src + (src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + new Date().getTime() + hash;
    }

    function playVideo(src, sound, onDone) {
      var p = $('player');
      clearTimeout(playerHideTimer);
      clearInterval(videoWatch);
      clearPlayerEvents(p);
      p.muted = !sound;
      p.volume = 1;

      // 重新載入（等同第一次播放）
      try { p.pause(); } catch (e) {}
      try { p.removeAttribute('src'); p.load(); } catch (e) {}
      p.setAttribute('data-src', src);
      p.src = freshUrl(src);
      try { p.load(); } catch (e) {}
      p.style.display = 'block';
      dbg('load+play ' + src.split('/').pop() + (sound ? ' (聲音)' : ' (靜音)'));

      var finished = false;
      var done = function (why) {
        if (finished) return;
        finished = true;
        clearInterval(videoWatch);
        dbg('next: ' + why);
        onDone();
      };
      p.onended = function () { done('ended'); };
      p.onerror = function () { done('ERROR code=' + (p.error ? p.error.code : '?')); };

      // 每秒檢查：播到尾巴就換下一張；連續 12 秒時間沒前進（卡住）就跳過；最長 10 分鐘
      var lastT = -1, stuckSecs = 0, totalSecs = 0, retried = false;
      videoWatch = setInterval(function () {
        totalSecs++;
        var ct = p.currentTime || 0;
        if (isFinite(p.duration) && p.duration > 1 && ct >= p.duration - 0.3) { done('reached end'); return; }
        if (ct > lastT + 0.05) { stuckSecs = 0; lastT = ct; } else { stuckSecs++; }
        if (stuckSecs >= 8 && !retried && p.readyState < 2) {
          // 完全沒拿到資料：換一個新網址再試一次
          retried = true; stuckSecs = 0;
          dbg('no data, retry load');
          try { p.src = freshUrl(src); p.load(); var rp = p.play(); if (rp && rp.catch) rp.catch(function () {}); } catch (e) {}
          return;
        }
        if (stuckSecs >= 12) { done('stuck ' + stuckSecs + 's at t=' + ct.toFixed(1)); return; }
        if (totalSecs >= 600) { done('10 min cap'); }
      }, 1000);

      try {
        var pr = p.play();
        if (pr && typeof pr['catch'] === 'function') {
          pr['catch'](function () {
            // 新版電腦瀏覽器擋有聲自動播放：改成靜音再播
            if (!p.muted) {
              p.muted = true;
              try { var pr2 = p.play(); if (pr2 && pr2['catch']) pr2['catch'](function () {}); } catch (e) {}
            }
          });
        }
      } catch (e) {}
      return null;
    }

    // 老 LG 實測：同一個網頁裡，影片只有「第一次」播得出來；第二次起不管怎麼重新載入，
    // 電視都拿不到資料（ready=0、已下載 0-0）。但網頁剛打開時的第一次播放永遠正常。
    // 所以在老電視上：影片播完就把解碼器還給電視、記住下一張，然後整頁重新整理。
    // 重新整理後先用上次存下的資料立刻顯示，從下一張接著播，看起來只是換頁。
    var RELOAD_AFTER_VIDEO = (CHROME_VER > 0 && CHROME_VER < 80) || location.hash.indexOf('reload') >= 0;
    function reloadAfterVideo(nextIndex) {
      try { localStorage.setItem('hhl_resume', JSON.stringify({ next: nextIndex, at: new Date().getTime() })); } catch (e) {}
      dbg('reload page, next=' + (nextIndex + 1));
      saveDbg();
      releasePlayer();
      setTimeout(function () { location.reload(); }, 300);
    }

    function play() {
      clearTimeout(timer);
      timer = null;
      var token = ++playToken;
      if (!slides.length) return;
      if (current >= slides.length) current = 0;

      // 只把「這一張」放進畫面，上一張淡出後移除
      var box = $('slides');
      var holder = document.createElement('div');
      holder.innerHTML = slideHtml[current];
      var el = holder.firstChild;
      box.appendChild(el);   // #player 一直留在 #slides 最底層
      void el.offsetWidth;                 // 讓淡入動畫生效
      el.className += ' active';

      var old = activeEl;
      activeEl = el;
      if (old) {
        old.className = old.className.replace(/\s*active/g, '');
        stopVideo(old);
        setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, 1100);
      }

      // 預載下一張圖片
      var nextItem = slides[(current + 1) % slides.length];
      var nextMedia = nextItem ? mediaInfo(nextItem.image) : null;
      if (nextMedia && nextMedia.kind === 'image') preloadImg.src = nextMedia.src;

      var activeData = slides[current];
      var acThreshold = (rawData.acAlert && rawData.acAlert.threshold !== null) ? Number(rawData.acAlert.threshold) : 28;

      if (activeData && activeData.type === 'ac-alert' && Number(activeData.temp) >= acThreshold) {
        var now = new Date();
        var mins = now.getHours() * 60 + now.getMinutes();
        // 12:00～13:34 午休：只顯示畫面，不嗶聲，也不消耗上午/下午的額度
        if (!(mins >= AC_BEEP_LUNCH_START && mins < AC_BEEP_AFTERNOON_START)) {
          var beepKey = getAcBeepKey(now);
          if (!hasAcBeeped(beepKey)) {
            markAcBeeped(beepKey);
            playAcAlertBeep();
          }
        }
      }

      var nextSlide = function () {
        if (token !== playToken) return;   // 避免影片結束和計時器重複觸發
        current = (current + 1) % slides.length;
        play();
      };

      var videoSrc = el.getAttribute('data-video');
      var ytEl = el.querySelector('iframe');
      if (!videoSrc) stopPlayer();
      if (videoSrc) {
        timer = playVideo(videoSrc, el.getAttribute('data-sound') === '1', RELOAD_AFTER_VIDEO ? function () {
          if (token !== playToken) return;
          reloadAfterVideo((current + 1) % slides.length);
        } : nextSlide);
      } else if (ytEl) {
        // YouTube 無法得知片長，依試算表「秒數」欄，沒填就播 30 秒
        timer = setTimeout(nextSlide, (Number(activeData.duration) || 30) * 1000);
      } else {
        timer = setTimeout(nextSlide, (Number(activeData.duration) || 12) * 1000);
      }
    }

    // 同一天上午、下午各最多嗶一次
    function getAcBeepKey(now) {
      var dateKey = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
      var mins = now.getHours() * 60 + now.getMinutes();
      return 'haidian-ac-alert-beep-' + dateKey + '-' + (mins >= AC_BEEP_AFTERNOON_START ? 'pm' : 'am');
    }
    function hasAcBeeped(key) {
      try { return localStorage.getItem(key) === '1'; } catch (e) { return acBeepFallback[key] === true; }
    }
    function markAcBeeped(key) {
      acBeepFallback[key] = true;
      try { localStorage.setItem(key, '1'); } catch (e) {}
    }

    var audioCtx = null;   // 共用一個，不要每次新建（舊瀏覽器有數量上限）
    function playAcAlertBeep() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.08;
        if (osc.start) osc.start(0); else osc.noteOn(0);
        setTimeout(function () {
          try { if (osc.stop) osc.stop(0); else osc.noteOff(0); } catch (e) {}
        }, 300);
      } catch (e) {}
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function updateClock() {
      var d = new Date();
      $('clock').textContent = pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function escapeHtml(str) { return String(str === 0 ? '0' : (str || '')).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    function escapeAttr(str) { return String(str || '').replace(/'/g, '%27').replace(/"/g, '%22'); }
    function trimText(str) { return String(str || '').replace(/^\s+|\s+$/g, ''); }

    // 網址最後加上 #ua，會在畫面上方顯示瀏覽器版本（查電視相容性用）
    // 網址最後加上 #debug：左上角顯示播放器狀態（只顯示資訊，不改變播放行為）
    var PAGE_VERSION = '2026-11-04 v5 影片播完重新整理網頁';
    // 偵錯畫面：老電視（Chromium 80 以下）自動顯示，不用改網址；電腦上要加 #debug 才顯示。
    // 查完問題後，把下面的 true 改成 false 就會關掉。
    var DEBUG_ON_OLD_TV = true;
    var DEBUG = location.hash === '#debug' || (DEBUG_ON_OLD_TV && CHROME_VER > 0 && CHROME_VER < 80);
    var dbgLines = [];
    try { if (DEBUG) dbgLines = JSON.parse(localStorage.getItem('hhl_dbg') || '[]'); } catch (e) { dbgLines = []; }
    function saveDbg() { try { if (DEBUG) localStorage.setItem('hhl_dbg', JSON.stringify(dbgLines)); } catch (e) {} }
    function dbg(msg) {
      if (!DEBUG) return;
      var d = new Date();
      dbgLines.unshift(pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + ' ' + msg);
      if (dbgLines.length > 8) dbgLines.length = 8;
    }
    if (DEBUG) {
      var dbgBox = document.createElement('div');
      dbgBox.style.cssText = 'position:absolute;top:80px;left:40px;z-index:99;background:rgba(0,0,0,.85);color:#0f0;font:20px/1.4 monospace;padding:10px;white-space:pre;';
      $('screen').appendChild(dbgBox);
      setInterval(function () {
        var p = $('player');
        var buf = '';
        try { for (var i = 0; i < p.buffered.length; i++) buf += p.buffered.start(i).toFixed(0) + '-' + p.buffered.end(i).toFixed(0) + ' '; } catch (e) {}
        dbgBox.textContent = PAGE_VERSION + '\n' +
          '投影片 ' + (current + 1) + '/' + slides.length + '  ready=' + p.readyState + ' net=' + p.networkState +
          ' 時間=' + (p.currentTime || 0).toFixed(1) + '/' + (isFinite(p.duration) ? p.duration.toFixed(0) : '?') +
          ' paused=' + p.paused + ' muted=' + p.muted + ' err=' + (p.error ? p.error.code : '-') + '\n' +
          '已下載=' + (buf || '無') + '\n' + dbgLines.join('\n');
      }, 1000);
      var evs = ['playing', 'waiting', 'stalled', 'ended', 'emptied', 'suspend', 'abort', 'seeked'];
      for (var e = 0; e < evs.length; e++) {
        (function (ev) { $('player').addEventListener(ev, function () { dbg('ev ' + ev + ' t=' + ($('player').currentTime || 0).toFixed(1)); }); })(evs[e]);
      }
    }

    if (location.hash === '#ua') {
      var uaBox = document.createElement('div');
      uaBox.style.cssText = 'position:absolute;top:80px;left:40px;right:40px;z-index:99;background:#000;color:#0f0;font-size:20px;padding:10px;';
      uaBox.textContent = navigator.userAgent + '  ｜ YouTube：' + (CAN_PLAY_YOUTUBE ? '可播' : '略過');
      $('screen').appendChild(uaBox);
    }

    updateClock();
    setInterval(updateClock, 15000);
    // 影片播完重新整理後：從下一張接著播，並先用上次的資料立刻顯示
    (function () {
      try {
        var r = JSON.parse(localStorage.getItem('hhl_resume') || 'null');
        localStorage.removeItem('hhl_resume');
        if (r && new Date().getTime() - r.at < 5 * 60 * 1000) {
          current = Number(r.next) || 0;
          dbg('page reloaded, resume at ' + (current + 1));
          var c = JSON.parse(localStorage.getItem('hhl_cache') || 'null');
          if (c) handleData(c);
        }
      } catch (e) {}
    })();
    loadData();
    setInterval(loadData, 60 * 1000);
    setTimeout(function () { releasePlayer(); location.reload(); }, 60 * 60 * 1000);
  </script>
</body>
</html>
